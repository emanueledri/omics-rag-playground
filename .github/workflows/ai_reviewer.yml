name: AI Code Reviewer (DeepSeek V4 Flash)

on:
  issue_comment:
    types: [created]

jobs:
  review_job:
    # Si attiva solo se il commento è dentro una Pull Request e inizia con "/"
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Run PR Agent
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          # Configurazione per usare l'ultimissimo DeepSeek V4 Flash su OpenRouter
          CUSTOM_MODELS.REVIEW: "deepseek/deepseek-v4-flash-latest" 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
