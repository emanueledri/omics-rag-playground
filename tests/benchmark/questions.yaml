# Benchmark question set for the reasoning layer (Stage 3, Session 5, Part 2).
#
# Twenty hand-annotated questions over the frozen 64-abstract corpus described by
# corpus_manifest.json. Ground truth is a single annotator's documented judgement,
# not a gold standard: there is no inter-annotator agreement to report.
#
# Annotation procedure: all 64 titles were read as triage, then full abstracts were
# read for every plausible candidate. Screening the whole corpus makes the |G|
# denominator complete, so Recall@k carries no pooling bias. Residual risk: title
# triage can miss a relevant abstract behind an uninformative title.
#
# relevance grades
#   2  directly supports a claim an answer should make (the citation ground truth, S)
#   1  topically relevant background
#   0  irrelevant -- omitted rather than listed
#
# Distances quoted in `notes` are cosine distances measured against
# pubmed_abstracts_no_mesh on 2026-09-03, for the question string exactly as written
# here. They are recorded to make the retrieval difficulty of each item auditable;
# they are not ground truth and Part 4 re-derives the threshold.

- id: q01
  question: "What is the role of BEST4 in colorectal cancer?"
  reasoning_type: function
  reference_answer: >-
    The corpus reports two opposing roles and an answer should surface both. One study
    finds BEST4 upregulated in CRC, correlated with advanced TNM stage, lymph node
    metastasis and poor survival, and shows BEST4 binding the PI3K p85-alpha subunit to
    activate Akt, MYC and CCND1, promoting proliferation and metastasis. The other finds
    BEST4 overexpression attenuates proliferation, colony formation and mobility and
    impedes tumour growth and liver metastasis, acting downstream of HES4 to downregulate
    TWIST1 and suppress EMT, with low BEST4 mRNA correlated with worse prognosis.
  relevance:
    "35058597": 2
    "39699952": 2
    "35114976": 1
    "35194111": 1
    "42052848": 1
  expected_confidence: [high, moderate]
  expects_fallback: false
  expected_failure: false
  notes: >-
    The two grade-2 abstracts contradict each other on the direction of effect. A
    faithful answer reports the disagreement; asserting one direction alone is a
    grounding error that only a judge will catch. Top-5 distances 0.42-0.62.

- id: q02
  question: "What is the function of AQP8 in colorectal cancer?"
  reasoning_type: function
  reference_answer: >-
    AQP8 is a water channel expressed in normal colonic epithelium, in the cells facing
    the lumen, and is a marker of normal colonocytes involved in fluid transport. It is
    consistently downregulated in adenomas and carcinomas relative to paired normal or
    paraneoplastic tissue. AQP8 is a direct target of miR-92a, and restoring AQP8
    restrains CRC cell proliferation, migration and invasion in vitro and tumour growth
    in vivo. Low tumoral AQP8 is an independent risk factor for worse overall survival.
