- id: q03
  question: "What is the function of KLK7 in colon cancer?"
  reasoning_type: function
  reference_answer: >-
    KLK7 is a secreted serine protease that is upregulated in colon cancer relative to
    paired normal mucosa and absent from normal epithelium. It acts as a proliferative
    factor: overexpression in HT29 cells increases proliferation in vitro and tumour
    growth in nude mice. It also facilitates metastasis by degrading extracellular matrix
    components. High KLK7 expression is associated with less differentiated, more
    advanced tumours and with shorter overall and disease-free survival, and is an
    independent prognostic factor, particularly for liver metastasis.
  relevance:
