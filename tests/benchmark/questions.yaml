- id: q12
  question: "Which genes are associated with microsatellite instability in colorectal cancer?"
  reasoning_type: topic
  reference_answer: >-
    Two categories appear. First, the mismatch-repair machinery and its unstable target
    loci: predisposing mutations in MLH1 and MSH2, with instability at BAT25/BAT26/BAT40
    and at coding repeats in TGF-beta RII, MSH3, BAX and PTEN. Second, expression
    correlates of MSI status: AXIN2, ETV4 and RNF43 as tumour-cell-specific signals and
    COL11A1, COMP, INHBA, SPP1, MMP3 and TLR2 as immune-cell-specific signals in MSI-high
    early-stage CRC, plus an 11-gene microsatellite-stability prognostic panel (CHGB,
    FABP4, PLIN4, PLIN1, RPRM, C7, AQP8, C2CD4A, APLP1, ADH1B, CD36).
