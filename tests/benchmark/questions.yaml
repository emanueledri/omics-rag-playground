- id: q04
  question: "What is the function of CA7 in colorectal cancer?"
  reasoning_type: function
  reference_answer: >-
    CA7 (carbonic anhydrase VII) is frequently downregulated in CRC at both mRNA and
    protein level, and behaves as a tumour suppressor. Reduced CA7 correlates with poor
    differentiation, positive lymph node metastasis, advanced TNM stage and shorter
    disease-specific survival, and is an independent adverse prognostic indicator in
    early stage tumours. Its downregulation is reproducible enough to serve in
    CRC-discriminatory transcript sets and in a CA2/CA7/ITM2C early-detection signature.
  relevance:
