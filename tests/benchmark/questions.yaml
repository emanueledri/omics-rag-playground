- id: q05
  question: "What does OTOP3 do in colorectal cancer?"
  reasoning_type: function
  reference_answer: >-
    OTOP3 is a proton channel at 17q25.1 that acts as an oncogenic regulator in CRC. It
    drives growth by enhancing c-Myc protein stability and by suppressing ferroptosis
    through GPX4. Silencing OTOP3 destabilises c-Myc, reduces proliferation and induces
    ferroptosis via GPX4 reduction, ROS accumulation and lipid peroxidation, alongside
    glycolytic shifts consistent with the Warburg effect.
  relevance:
    "40586985": 2
    "31612869": 1
    "34477243": 1
    "35587572": 1
    "39484215": 1
  expected_confidence: [high, moderate]
  expects_fallback: false
  expected_failure: false
  notes: >-
    Measured ranking failure, deliberately kept. Top-1 at 0.51 is the OTOP2 paper
    (30652071); the one grade-2 abstract ranks third at 0.68. The embedding does not
    separate the OTOP2 and OTOP3 symbols, so this item measures near-miss symbol
    confusion. |S|=1, so citation recall is all-or-nothing here.

- id: q06
  question: "How does COMP promote epithelial-mesenchymal transition in colorectal cancer?"
  reasoning_type: mechanism
  reference_answer: >-
    COMP interacts with the actin-binding protein transgelin (TAGLN), and the COMP/TAGLN
    complex regulates cytoskeletal remodelling to drive EMT: COMP overexpression promotes
    EMT while knockdown inhibits metastasis and invasion, and the flavonoid Chrysin
    targets the interaction interface and blocks both. Consistent with this, COMP
    expression coexpresses with the EMT markers CDH2, FN1, VIM, TWIST1, TWIST2, SNAI1,
    SNAI2, ZEB1, ZEB2, POSTN, MMP2, MMP9 and COL1A1, and more mesenchymal tumours carry
    higher COMP.
  relevance:
