    "36910014": 1
  expected_confidence: [high]
  expects_fallback: false
  expected_failure: false
  notes: "Both grade-2 abstracts rank top-2 (0.41, 0.42). Top-5 distances 0.41-0.55."

- id: q07
  question: "How does BEST4 suppress epithelial-to-mesenchymal transition in colorectal cancer cells?"
  reasoning_type: mechanism
  reference_answer: >-
    BEST4 is co-expressed with HES4 in the nucleus, and HES4 signals BEST4 by binding the
    upstream region of the BEST4 promoter. BEST4 is epistatic to HES4 and downregulates
    TWIST1, thereby inhibiting EMT. CRISPR/Cas9 knockout of BEST4 revitalises tumour
    growth and induces EMT, and BEST4 overexpression attenuates proliferation, colony
    formation and mobility in vitro and tumour growth and liver metastasis in vivo.
  relevance:
    "39699952": 2
    "35058597": 1
    "42052848": 1
  expected_confidence: [high]
  expects_fallback: false
  expected_failure: false
  notes: >-
    Sharpest retrieval in the set: top-1 0.36, and the next four are 0.51-0.58. |S|=1.
    35058597 is graded 1 as background because it argues the opposite direction of effect.

- id: q08
  question: "How do cancer-associated fibroblasts promote colon cancer growth and metastasis?"
  reasoning_type: mechanism
  reference_answer: >-
    CAFs act on colon cancer cells through paracrine COMP. Secreted COMP activates the
    PI3K/AKT pathway; AKT phosphorylates and stabilises RLIM, which then ubiquitinates
    and degrades PML, and PML overexpression inhibits the CAF-enhanced growth and
    metastasis. COMP is also a CAF-driven prognostic gene whose upregulation tracks
    stromal and immune activation and M2 macrophage infiltration.
  relevance:
    "36671447": 2
    "39162054": 2
    "36551305": 1
    "36933827": 1
    "37207219": 1
  expected_confidence: [high, moderate]
  expects_fallback: false
  expected_failure: false
  notes: "Top-5 distances 0.50-0.65; the second grade-2 abstract sits at 0.60."

- id: q09
  question: "How does wild-type p53 regulate OTOP2 expression in colorectal cancer?"
  reasoning_type: mechanism
  reference_answer: >-
    Wild-type p53, but not mutant p53, regulates transcription of otop2 in CRC cells.
    The mechanism is architectural: the otop2 promoter shows p53-dependent differences in
    DNA loop organisation and in CTCF binding between wild-type and mutant p53 cells.
    OTOP2 itself is downregulated in tumour tissue, its expression correlates with
    malignancy grade and survival, and elevating it suppresses tumour proliferation
    in vitro.
  relevance:
    "30652071": 2
    "37543577": 1
    "39484215": 1
  expected_confidence: [high]
  expects_fallback: false
  expected_failure: false
  notes: >-
    Tightest single match in the benchmark: top-1 0.27, next 0.62. |S|=1, and the
    remaining four retrieved documents at k=5 are all irrelevant, so Precision@5 is
    capped at 0.20 -- expected, not a defect.

- id: q10
  question: "How does TRIP13 promote metastasis in colorectal cancer?"
  reasoning_type: mechanism
  reference_answer: >-
    TRIP13 expression rises progressively from adenoma to carcinoma and is elevated in
    liver metastases, independently of p53 and microsatellite instability status.
    Knockdown impedes colony formation, invasion, motility and spheroid formation, and
    xenografts show reduced growth and metastasis. Mechanistically TRIP13 interacts with
    the tyrosine kinase FGFR4, which appears necessary for EGFR-AKT activation, and it
    also engages Wnt signalling and EMT. TRIP13 is itself regulated by miR-192 and PNPT1,
    and COL6A3, TREM2, SHC3 and KLK7 are downstream targets.
  relevance:
    "33037736": 2
    "35114976": 1
  expected_confidence: [high]
  expects_fallback: false
  expected_failure: false
  notes: >-
    Smallest relevant set (|G|=2), so Recall@5 is either 0.5 or 1.0 -- a coarse but valid
    measurement. Top-1 0.38, next 0.60.

