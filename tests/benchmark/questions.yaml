- id: q15
  question: "Which genes link the colorectal tumour microenvironment to immune-cell infiltration?"
  reasoning_type: topic
  reference_answer: >-
    COMP is the gene the corpus ties most directly to immune infiltration, in both
    directions of the same story. High COMP correlates with denser fibrosis, fewer
    infiltrating T cells and reduced PD-L1 on tumour and immune cells, yet also with
    enhanced stromal and immune activation and specifically with M2 macrophage and
    cancer-associated fibroblast abundance, and it predicts immunotherapy response. Its
    expression separates TGF-beta-pathway CRC subtypes with distinct immune
    characteristics.
